name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Change this to your default branch if it's named 'master'

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: 🔨 Install dependencies and Build
        run: |
          npm install
          npm run build
        # Note: If your Vite build requires these secrets to bake them into the JS bundle, define them here!
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🔍 Check host DNS resolution
        run: |
          if ! getent hosts "${{ secrets.FTP_SERVER }}"; then
            echo "ERROR: cannot resolve '${{ secrets.FTP_SERVER }}'. Verify the FTP_SERVER secret."
            echo "Make sure it does NOT include 'ftp://' or 'sftp://' - it should just be the hostname (e.g. ftp.yourdomain.com or IP address)."
            exit 1
          fi

      - name: 📂 Sync files to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
